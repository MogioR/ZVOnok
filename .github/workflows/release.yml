name: Release Docker image and deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      rollback_to_previous:
        description: "Deploy the previous git tag automatically"
        required: false
        default: true
        type: boolean
      rollback_tag:
        description: "Optional explicit Docker image tag to deploy, for example v1.0.2"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: vars
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
        run: |
          set -eu

          if [ -n "$DOCKERHUB_REPOSITORY" ]; then
            IMAGE_REPOSITORY="$DOCKERHUB_REPOSITORY"
          else
            IMAGE_REPOSITORY="$DOCKERHUB_USERNAME/${GITHUB_REPOSITORY#*/}"
          fi

          IMAGE_REPOSITORY="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          echo "image_repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "image_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_repository }}:${{ steps.vars.outputs.image_tag }}
            ${{ steps.vars.outputs.image_repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on server
    runs-on: ubuntu-latest
    needs:
      - build
    if: github.event_name == 'push'
    steps:
      - name: Resolve image tags
        id: vars
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
        run: |
          set -eu

          if [ -n "$DOCKERHUB_REPOSITORY" ]; then
            IMAGE_REPOSITORY="$DOCKERHUB_REPOSITORY"
          else
            IMAGE_REPOSITORY="$DOCKERHUB_USERNAME/${GITHUB_REPOSITORY#*/}"
          fi

          IMAGE_REPOSITORY="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          echo "image_repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "image_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
          IMAGE_REPOSITORY: ${{ steps.vars.outputs.image_repository }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,SERVER_APP_DIR,IMAGE_REPOSITORY,IMAGE_TAG
          script: |
            set -eu
            cd "$SERVER_APP_DIR"
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            APP_IMAGE="$IMAGE_REPOSITORY:$IMAGE_TAG" docker compose -f docker-compose.prod.yml pull
            APP_IMAGE="$IMAGE_REPOSITORY:$IMAGE_TAG" docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

  rollback:
    name: Roll back on server
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve image repository
        id: vars
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
        run: |
          set -eu

          if [ -n "$DOCKERHUB_REPOSITORY" ]; then
            IMAGE_REPOSITORY="$DOCKERHUB_REPOSITORY"
          else
            IMAGE_REPOSITORY="$DOCKERHUB_USERNAME/${GITHUB_REPOSITORY#*/}"
          fi

          IMAGE_REPOSITORY="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          echo "image_repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Resolve rollback tag
        id: rollback_tag
        env:
          ROLLBACK_TO_PREVIOUS: ${{ inputs.rollback_to_previous }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          set -eu

          if [ "$ROLLBACK_TO_PREVIOUS" = "true" ]; then
            PREVIOUS_TAG="$(git tag --list 'v*' --sort=-version:refname | sed -n '2p')"

            if [ -z "$PREVIOUS_TAG" ]; then
              echo "Previous tag was not found. At least two release tags are required." >&2
              exit 1
            fi

            IMAGE_TAG="$PREVIOUS_TAG"
          else
            if [ -z "$ROLLBACK_TAG" ]; then
              echo "rollback_tag is required when rollback_to_previous is false." >&2
              exit 1
            fi

            IMAGE_TAG="$ROLLBACK_TAG"
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Roll back via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
          IMAGE_REPOSITORY: ${{ steps.vars.outputs.image_repository }}
          IMAGE_TAG: ${{ steps.rollback_tag.outputs.image_tag }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,SERVER_APP_DIR,IMAGE_REPOSITORY,IMAGE_TAG
          script: |
            set -eu
            cd "$SERVER_APP_DIR"
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            APP_IMAGE="$IMAGE_REPOSITORY:$IMAGE_TAG" docker compose -f docker-compose.prod.yml pull
            APP_IMAGE="$IMAGE_REPOSITORY:$IMAGE_TAG" docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
